name: macOS bundle
on: [workflow_dispatch, push]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install qt cmake ninja
      - run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HEXFORGE-macOS-${{ matrix.arch }}
          path: build-macos/HEXFORGE-macOS.zip
